dri_integration_plan:
- chapter: fiber
  dri_content: Adequate Intake for fiber (14 g / 1000 kcal; ~25 g/d women, 38 g/d men); margin sidebar with NHANES intake
    gap
- chapter: energy-balance
  dri_content: EER equations; PAL categories; AMDR overview
- chapter: proteins-amino-acids-overview
  dri_content: "RDA for protein (0.8 g/kg/d); AMDR 10\u201335%; EAR vs RDA distinction; PDCAAS/DIAAS cross-link"
- chapter: lipids-introduction
  dri_content: "AI for linoleic and \u03B1-linolenic acids; AMDR 20\u201335%; SFA <10% guidance"
mineral_cofactor_integration_plan:
- chapter: tca-cycle
  source: 'Minerals as Cofactors (video #32)'
  content: Fe-S clusters and heme-Fe in TCA enzymes (aconitase, SDH, fumarase); cofactor requirements per step
- chapter: pentose-phosphate-pathway
  source: 'Minerals as Cofactors (video #32)'
  content: Se-dependent GPx, Cu/Zn-SOD1, Mn-SOD2, Fe-catalase; ties to NADPH/GSH from the PPP arm of the chapter
