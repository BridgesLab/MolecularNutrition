disposition_legend:
  good: Clean overlap; pilot a chapter pass to confirm.
  good-multi-deck: Chapter is covered by multiple decks/videos in combination.
  partial: Significant overlap but covers some material beyond the chapter scope.
  weak-partial: Only loosely covers the chapter content.
  orphan-chapter: Chapter has no legacy NUTR594 deck/video; decide whether to build new material.
