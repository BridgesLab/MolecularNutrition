name: molecuar-nutrition
#Environment for molecular nutrition notes, for compiling into HTML with Pandoc.
# Runs as 

# pandoc tex/test_citations.tex \
#   --from=latex+raw_tex \
#   --to=html5 \
#   --filter=scripts/tufte_filter.py \
#   --template=html/tufte_template.html \
#   --mathjax=https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js \
#   --citeproc \
#   --bibliography=tex/library.bib \
#   -V htmlversion \
#   --standalone \
#   -o tex/test.html

channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandoc>=3.1,<4  # Built-in citeproc; 3.x verified working
  - pip
  - pip:
      - panflute