<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title)$$title$ — Molecular Nutrition$else$Molecular Nutrition$endif$</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="um.css">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" type="text/javascript"></script>
  $for(header-includes)$
    $header-includes$
  $endfor$
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- SITE_NAV: replaced per-chapter by scripts/build_html.py with the
       navigation fragment (current chapter marked aria-current). -->
  <!--SITE_NAV-->

  <main id="main-content">
    <article>
      $if(title)$<h1>$title$</h1>$endif$
      <div class="chapter-meta">
        $if(author)$<span class="byline">$for(author)$$author$$sep$, $endfor$</span>$endif$
        $if(updated)$<span class="updated">Updated $updated$</span>$endif$
      </div>
      $body$
      <div class="chapter-footer">
        <a class="pdf-button" href="pdf/$chapterstem$.pdf">⬇ Download this chapter as a typeset PDF</a>
      </div>
    </article>
  </main>
</body>
</html>
