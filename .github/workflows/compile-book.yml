name: Compile LaTeX Book

on:
  push:
    branches:
      - main
    paths:
      - 'tex/*.tex'
      - 'tex/library.bib'
      - 'tex/*/pdf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run LaTeX processing script
      run: |
        chmod +x scripts/process-tex-files.sh
        ./scripts/process-tex-files.sh

    - name: Compile LaTeX document
      id: compile
      uses: xu-cheng/latex-action@v4
      with:
        root_file: nutr630-notes.tex
        compiler: latexmk
        args: -pdf -f -file-line-error -interaction=nonstopmode -latexoption="-shell-escape" -latexoption="-synctex=1"
        extra_system_packages: |
          inkscape
          ghostscript
          makeindex
        texlive_version: 2025
        post_compile: |
          bibtex nutr630-notes
          makeindex nutr630-notes.idx
          makeindex nutr630-notes.nlo -s nomencl.ist -o nutr630-notes.nls

    - name: Check PDF existence
      id: check-pdf
      run: |
        if [ -f "nutr630-notes.pdf" ]; then
          echo "pdf_exists=true" >> $GITHUB_OUTPUT
          echo "PDF generated successfully"
        else
          echo "pdf_exists=false" >> $GITHUB_OUTPUT
          echo "PDF not generated, uploading log for debugging"
        fi

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      if: steps.check-pdf.outputs.pdf_exists == 'true' && always()
      with:
        name: principles-of-nutrition-science
        path: nutr630-notes.pdf

    - name: Upload Log Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: latex-log
        path: nutr630-notes.log