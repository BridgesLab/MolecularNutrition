name: Compile LaTeX Book

on:
  push:
    branches:
      - main
    paths:
      - 'tex/*.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run LaTeX processing script
      run: |
        chmod +x scripts/process-tex-files.sh
        ./scripts/process-tex-files.sh

    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: nutr630-notes.tex
        compiler: latexmk
        args: -pdf -file-line-error -interaction=nonstopmode
        extra_system_packages: |
          inkscape
          ghostscript
        texlive_version: 2025

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: principles-of-nutrition-science
        path: nutr630-notes.pdf