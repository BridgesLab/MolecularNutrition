name: Compile LaTeX Book

on:
  push:
    branches:
      - main
    paths:
      - 'tex/*.tex'
      - 'tex/library.bib'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run preprocessing script
      run: |
        chmod +x scripts/process-tex-files.sh
        ./scripts/process-tex-files.sh

    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: nutr630-notes.tex
        compiler: latexmk
        args: -pdf -f -file-line-error -interaction=nonstopmode -latexoption="-shell-escape" -latexoption="-synctex=1"
        extra_system_packages: |
          inkscape
          ghostscript
        texlive_version: 2025

    - name: Run makeindex for regular index
      run: |
        makeindex nutr630-notes.idx || true

    - name: Run makeindex for nomenclature
      run: |
        makeindex nutr630-notes.nlo -s nomencl.ist -o nutr630-notes.nls || true

    - name: Recompile to resolve references
      uses: xu-cheng/latex-action@v4
      with:
        root_file: nutr630-notes.tex
        compiler: latexmk
        args: -pdf -f -interaction=nonstopmode

    - name: Commit updated PDF to repository
      run: |
        cp nutr630-notes.pdf "Principles of Nutrition Science.pdf"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        pushed=false
        for i in 1 2 3 4 5; do
          git fetch origin main
          git reset --soft origin/main               # move HEAD to latest remote, keep the new PDF in the working tree
          git add "Principles of Nutrition Science.pdf"
          if git diff --cached --quiet; then
            echo "PDF matches remote; nothing to commit."
            pushed=true
            break
          fi
          git commit -m "Update compiled book PDF [skip ci]"
          if git push origin main; then
            pushed=true
            break
          fi
          echo "Push attempt $i lost a race (remote advanced). Retrying..."
          sleep $((RANDOM % 5 + 3))
        done

        if [ "$pushed" != "true" ]; then
          echo "::error::Failed to push updated PDF after 5 attempts."
          exit 1
        fi

    - name: Upload PDF artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Principles-of-Nutrition-Science-pdf
        path: Principles of Nutrition Science.pdf

    - name: Upload LaTeX log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latex-log
        path: nutr630-notes.log