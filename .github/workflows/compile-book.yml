name: Compile LaTeX Book

on:
  push:
    branches:
      - main
    paths:
      - 'tex/*.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up TeX Live
      uses: texlive-actions/setup-texlive@v1
      with:
        packages: >-
          tufte-latex
          subfiles
          booktabs
          graphicx
          fancyvrb
          units
          makeindex
          nomencl
          lipsum
          blindtext
          amsmath
          xspace
          hyperref
          natbib

    - name: Run LaTeX processing script
      run: |
        chmod +x scripts/process-tex-files.sh
        ./scripts/process-tex-files.sh

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: principles-of-nutrition-science
        path: nutr630-notes.pdf