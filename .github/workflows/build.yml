name: Build and Deploy Notes (HTML)

on:
  push:
    branches: ["main"]
    paths:
      - 'tex/*.tex'
      - 'tex/*.bib'
      - 'tex/figures/**'
      - 'html/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
       
      - name: Check for Tufte macro bridge in all .tex files
        run: |
          missing=()
          for f in tex/*.tex; do
            if ! grep -q 'ifdefined\\htmlversion' "$f"; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following .tex files are missing the Tufte macro bridge (\ifdefined\htmlversion block):"
            for f in "${missing[@]}"; do echo "  $f"; done
            exit 1
          fi

      - name: Create output directories
        run: mkdir -p output/pdf output/figures
      
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: base
          auto-activate-base: true
      
      - name: Update, activate, and process tex files
        shell: bash -l {0}
        run: |
          source /usr/share/miniconda/etc/profile.d/conda.sh
          conda env update -f environment.yml -n base
          conda activate base
          for f in tex/*.tex; do
            fname=$(basename "$f" .tex)
            pandoc "$f" \
              --from=latex+raw_tex \
              --to=html5 \
              --filter=scripts/tufte_filter.py \
              --template=html/tufte_template.html \
              --mathjax=https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js \
              --citeproc \
              --bibliography=tex/library.bib \
              -V htmlversion \
              --standalone \
              -o "output/${fname}.html"
          done

      - name: Compile chapter PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "tex/*.tex"
          work_in_root_file_dir: true
          compiler: latexmk
          args: -pdf -f -interaction=nonstopmode -latexoption="-shell-escape"
          extra_system_packages: |
            inkscape
            ghostscript
          texlive_version: 2025

      - name: Copy PDFs
        run: cp tex/*.pdf output/pdf/

      - name: Copy figures
        run: |
          mkdir -p output/figures
          if [ -d tex/figures ]; then
            cp -r tex/figures/* output/figures/
          fi

      - name: Copy CSS files
        run: |
          cp html/tufte.css output/ || true
          cp html/custom.css output/ || true

      - name: Generate index.html from chapter list
        run: python scripts/generate_index.py

      - name: Upload site content
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
