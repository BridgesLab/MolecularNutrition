name: Build and Deploy Notes (HTML)

on:
  push:
    branches: ["main"]
    paths:
      - 'tex/*.tex'
      - 'tex/*.bib'
      - 'tex/figures/**'
      - 'html/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so per-chapter "Updated" dates resolve

      - name: Check for Tufte macro bridge in all .tex files
        run: |
          missing=()
          for f in tex/*.tex; do
            if ! grep -q 'ifdefined\\htmlversion' "$f"; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following .tex files are missing the Tufte macro bridge (\ifdefined\htmlversion block):"
            for f in "${missing[@]}"; do echo "  $f"; done
            exit 1
          fi

      - name: Create output directories
        run: mkdir -p output/pdf output/figures
      
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: base
          auto-activate-base: true
      
      - name: Update conda env and build HTML site
        shell: bash -l {0}
        run: |
          source /usr/share/miniconda/etc/profile.d/conda.sh
          conda env update -f environment.yml -n base
          conda activate base
          # Builds every chapter (pandoc + tufte_filter.py + template),
          # injects the shared navigation, and writes index.html.
          python scripts/build_html.py output

      - name: Compile chapter PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "tex/*.tex"
          work_in_root_file_dir: true
          compiler: latexmk
          args: -pdf -f -interaction=nonstopmode -latexoption="-shell-escape"
          extra_system_packages: |
            inkscape
            ghostscript
          texlive_version: 2025

      - name: Copy PDFs
        run: cp tex/*.pdf output/pdf/

      - name: Copy figures
        run: |
          mkdir -p output/figures
          if [ -d tex/figures ]; then
            cp -r tex/figures/* output/figures/
          fi

      - name: Copy CSS
        run: cp html/um.css output/

      - name: Copy compiled book PDF
        run: |
          if [ -f "Principles of Nutrition Science.pdf" ]; then
            cp "Principles of Nutrition Science.pdf" output/
          else
            echo "::warning::Compiled book PDF not present in checkout; home-page download link will 404 until compile-book workflow commits it."
          fi

      - name: Upload site content
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
