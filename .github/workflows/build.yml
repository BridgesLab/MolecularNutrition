name: Build and Deploy Notes (HTML)

on:
  push:
    branches: ["main"]
    paths:
      - 'tex/*.tex'
      - 'scripts/**'
      - 'html/index.html'
      - 'html/tufte.css'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
       
      - name: Create output directory
        run: mkdir -p output/pdf output/figures  
      
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: base
          auto-activate-base: true
      
      - name: Update, activate, and process tex files
        shell: bash -l {0}
        run: |
          source /usr/share/miniconda/etc/profile.d/conda.sh
          conda env update -f environment.yml -n base
          conda activate base
          for f in tex/*.tex; do
            fname=$(basename "$f" .tex)
            pandoc "$f" \
              --from=latex+raw_tex \
              --to=html5 \
              --filter=scripts/tufte_filter.py \
              --template=html/tufte_template.html \
              --mathjax=https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js \
              --citeproc \
              --bibliography=tex/library.bib \
              -V htmlversion \
              --standalone \
              -o "output/${fname}.html"
          done

      - name: Copy PDFs
        run: cp tex/*.pdf output/pdf/

      - name: Copy figures
        run: cp -r tex/figures/* output/figures/ || true

      - name: Copy CSS files
        run: |
          cp html/tufte.css output/
          cp html/custom.css output/ || true

      - name: Copy custom index.html
        run: cp html/index.html output/

      - name: Upload site content
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
