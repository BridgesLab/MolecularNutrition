<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="../html/tufte.css">
  <link rel="stylesheet" href="../html/custom.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>
<body>
  <article>
        <p><span class="newthought">This is a new thought</span> that
        begins this section with special formatting. Regular text
        follows to show the contrast.</p>
        <p>More content here. Let’s add a <span
        class="sidenote-wrapper"><span class="margin-icon">‡</span><span
        class="sidenote">Side note example</span></span> in the middle
        of the sentence.</p>
        <p>Another paragraph with a <span
        class="marginnote-wrapper"><span
        class="margin-icon">‡</span><span class="marginnote">Margin note
        example</span></span>.</p>
  </article>
</body>
</html>
